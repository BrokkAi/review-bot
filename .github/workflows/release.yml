name: Release
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Require a release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py "$RELEASE_TAG"
      - name: Check archives
        run: |
          cd dist
          sha256sum --check checksums.txt
          tar -xzf brokk-review-bot-*-linux-amd64.tar.gz brv
          ./brv --help
          rm brv
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt dist/release.json --verify-tag --draft --title "Brokk Review Bot $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
